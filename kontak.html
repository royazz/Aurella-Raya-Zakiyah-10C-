<main class="formulir">
  <section>
    <h2>Hubungi Kami</h2>
    <p><strong>Alamat:</strong> Jl. Sukodono,Sidoarjo</p>
    <p><strong>Email:</strong> aurellaraya29@email.com</p>
    <p><strong>No. WhatsApp:</strong> 0812-3456-7890</p>
    <p><strong>Jam Operasional:</strong> 08.00 - 23.00 WIB</p>
  </section>

  <form id="formKontak">
    <label>Nama:</label><br>
    <input type="text" id="nama" name="nama" required placeholder="nama Lengkap">

    <label>Email:</label><br>
    <input type="email" id="email" name="email" required placeholder="email@example.com">

    <label>Pesan:</label><br>
    <textarea id="pesan" name="pesan" required placeholder="tulis pesan anda.." rows="5">
    </textarea>

    <button type="submit">Kirim Pesan</button>
  </form>

  <div id="notifikasi"></div>
</main>

<footer>
  <p>&copy; 2026 Toko Buku Aurella Raya</p>
</footer>

<script>document.getElementById("formKontak").addEventListener("submit", function(e) {
    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const email = document.getElementById("email").value;
    const pesan = document.getElementById("pesan").value;

    if(nama && email && pesan){
      document.getElementById("notifikasi").innerHTML =
        "<p style='color:green;'>Pesan berhasil dikirim!</p>";
      this.reset();
    } else {
      document.getElementById("notifikasi").innerHTML =
        "<p style='color:red;'>Semua field harus diisi!</p>";
    }
  });
</script> 
</body>
